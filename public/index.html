<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#15171c">
<title>Ucompiler — Web-Native C IDE</title>
<style>
:root{
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:"SF Mono",SFMono-Regular,ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;
}
html,body{margin:0;padding:0;height:100%;background:#0f1013;overflow:hidden}
button{font:inherit;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}

.ide{--bg:#15171c;--bg2:#1b1e25;--bg3:#1f222a;--bg4:#262a34;--line:#272b35;--t1:#e8eaf0;--t2:#a3aab6;--t3:#67707e;--t4:#454c59;--sel:rgba(91,157,255,.16);--acc:#5b9dff;--green:#7ec699;--red:#e06c75;--yellow:#e5c07b;--purple:#c586c0;--orange:#ce9178;--num:#b5cea8;--com:#6a9955;--fn:#dcdcaa;
position:relative;width:100%;height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--t1);font-family:var(--font-sans)}
@supports (height:100dvh){.ide{height:100dvh}}
.ide *{transition:background-color .18s,color .18s,border-color .18s}

/* ===== header ===== */
.hdr{display:flex;align-items:center;gap:8px;height:52px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--bg2);flex:none}
.logo{width:30px;height:30px;border-radius:8px;background:var(--t1);color:var(--bg);display:flex;align-items:center;justify-content:center;flex:none}
.wordmark{font-size:15px;font-weight:500}
.filechip{font-size:12px;color:var(--t3);border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--bg3);white-space:nowrap}
.spacer{flex:1}
.btn{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:0;font-size:13px;font-weight:500;cursor:pointer;flex:none;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--t2)}
.btn.ghost:hover{background:var(--bg4);color:var(--t1)}
.btn.primary{background:var(--t1);color:var(--bg)}
.btn.primary:disabled{opacity:.55;cursor:default}
.btn.primary.busy svg{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.vdiv{width:1px;height:20px;background:var(--line);flex:none}

/* ===== split ===== */
.main{flex:1;display:flex;min-height:0}
.edwrap{display:flex;flex:1;min-width:0;border-right:1px solid var(--line)}
.gut{width:46px;flex:none;overflow:hidden;padding:12px 0}
.gutin{text-align:right;padding-right:10px;color:var(--t4);user-select:none;font-family:var(--font-mono);font-size:13px;line-height:21px}
.gnum{height:21px;display:flex;align-items:center;justify-content:flex-end;gap:4px}
.gnum.on{color:var(--t2)}
.gerr{width:8px;height:8px;border-radius:50%;background:var(--red);cursor:pointer;flex:none}
.gerr:hover{box-shadow:0 0 0 3px rgba(224,108,117,.3)}
.edbox{position:relative;flex:1;min-width:0;overflow:hidden;background:var(--bg3)}
.hl{position:absolute;inset:0;margin:0;padding:12px 14px;font:13px/21px var(--font-mono);white-space:pre;color:var(--t2);pointer-events:none;overflow:hidden}
.ta{position:absolute;inset:0;padding:12px 14px;border:0;outline:0;background:transparent;color:transparent;caret-color:var(--t1);resize:none;font:13px/21px var(--font-mono);white-space:pre;overflow:auto}
.ta::selection{background:var(--sel)}
.ig{display:inline-block;line-height:21px;border-left:1px solid var(--line)}
.tk-kw{color:var(--purple)}.tk-str{color:var(--orange)}.tk-fn{color:var(--fn)}.tk-num{color:var(--num)}.tk-com{color:var(--com)}.tk-pre{color:var(--t3)}.tk-inc{color:var(--t2)}
.tk-errl{background:rgba(224,108,117,.12);text-decoration:underline wavy var(--red);text-underline-offset:3px}
.hovertip{position:absolute;right:12px;z-index:11;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:11.5px;font-family:var(--font-mono);color:var(--red);max-width:75%;box-shadow:0 6px 18px rgba(0,0,0,.3);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== terminal ===== */
.termwrap{width:44%;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.th{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;background:var(--bg2);border-bottom:1px solid var(--line);flex:none;color:var(--t3);font-size:12px}
.tdot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
.ttitle{font-weight:500;color:var(--t1)}
.tb{flex:1;min-height:0;padding:10px 14px;font-family:var(--font-mono);font-size:12.5px;line-height:21px;overflow:auto}
.tl{white-space:pre-wrap;word-break:break-all}
.pr{color:var(--t3)}.cm{color:var(--t1)}.er{color:var(--red)}.dm{color:var(--t4)}
.chip{margin:6px 14px 0;display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;font-size:11px;font-family:var(--font-sans);font-weight:500}
.chip.ok{color:var(--green);background:rgba(126,198,153,.14)}
.chip.bad{color:var(--red);background:rgba(224,108,117,.14)}

/* ===== toast ===== */
.toast{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);background:var(--t1);color:var(--bg);font-size:12px;font-weight:500;padding:7px 14px;border-radius:8px;z-index:50;transition:opacity .18s;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}

/* ===== mobile: stack vertically ===== */
@media(max-width:640px){
  .wordmark,.filechip{display:none}
  .btn{padding:0 9px}
  .blabel{display:none}
  .main{flex-direction:column}
  .edwrap{flex:1;min-height:0;border-right:0;border-bottom:1px solid var(--line)}
  .termwrap{width:100%;height:38%;flex:none}
  .hdr{gap:6px}
}
</style>
